<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ビンゴ景品一覧</title>
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --ink:#2a2420; --sub:#7a6f66;
  --accent:#d9480f; --line:#e8dfd3; --slot:#f4ede3; --shade:rgba(30,20,10,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1917; --card:#26221f; --ink:#f3eee8; --sub:#a8a09a;
    --accent:#ff8a4c; --line:#3a3430; --slot:#2f2a26; --shade:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1917; --card:#26221f; --ink:#f3eee8; --sub:#a8a09a;
  --accent:#ff8a4c; --line:#3a3430; --slot:#2f2a26; --shade:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
header{padding:40px 16px 24px;text-align:center}
.fest{display:inline-block;font-size:13px;letter-spacing:.2em;color:var(--accent);
  border:1.5px solid var(--accent);border-radius:999px;padding:2px 14px;margin-bottom:12px}
h1{margin:0;font-size:clamp(26px,7vw,40px);letter-spacing:.06em}
.lead{margin:10px auto 0;max-width:34em;color:var(--sub);font-size:14px}
.hint{margin:8px 0 0;font-size:13px;color:var(--accent)}
.tools{max-width:960px;margin:0 auto;padding:0 16px 16px;display:flex;gap:12px;align-items:center}
.tools input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tools input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:13px;color:var(--sub);white-space:nowrap}
main{max-width:960px;margin:0 auto;padding:0 16px 48px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){main{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:900px){main{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;
  transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slot{width:100%;aspect-ratio:4/3;background:var(--slot);display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--line)}
.slot img{width:100%;height:100%;object-fit:contain;padding:10px;background:#fff}
.ph{width:calc(100% - 20px);height:calc(100% - 20px);border:2px dashed var(--line);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--sub);font-size:12px}
.ph svg{width:28px;height:28px;opacity:.6}
.name{padding:10px 12px 4px;font-size:14px;font-weight:600;word-break:break-word;flex:1}
.more{padding:0 12px 10px;font-size:12px;color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:32px 0}
footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 32px}
#waiting-screen{display:none}

/* 協賛品ポップアップ */
dialog{border:none;padding:0;border-radius:18px;background:var(--card);color:var(--ink);
  width:min(480px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto}
dialog::backdrop{background:var(--shade)}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 8px}
.dlg-head h2{margin:0;font-size:18px;flex:1;word-break:break-word}
.close{border:none;background:var(--slot);color:var(--ink);width:36px;height:36px;border-radius:50%;
  font-size:20px;line-height:1;cursor:pointer;flex:none}
.dlg-label{margin:0 18px 8px;font-size:12px;letter-spacing:.15em;color:var(--accent)}
.items{list-style:none;margin:0;padding:0 18px 20px;display:grid;gap:12px}
.item{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item .slot{aspect-ratio:16/9}
.item p{margin:0;padding:10px 12px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<!--
  ▼ 画像の差し込み方
  1. このファイルと同じ場所に「images」フォルダを作り、ロゴや協賛品の画像を入れる
  2. 下の SPONSORS の該当箇所に画像のファイル名を書く
     ・企業ロゴ（一覧のカード）… img: ""
       例）{ name: "キスミー（伊勢半）", img: "images/isehan.png", items: [...] }
     ・協賛品の写真（タップ後の画面）… items の中の img: ""
       例）{ text: "ヒロインメイクマスカラ", img: "images/mascara.jpg" }
  img が空のあいだは「画像準備中」の枠が表示されます。
-->
<div id="waiting-screen" style="min-height:100vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px;">
  <div class="fest">コスモス祭 2026</div>
  <h1 style="margin:16px 0 12px;font-size:clamp(22px,6vw,36px)">ビンゴ準備中</h1>
  <p style="color:var(--sub);margin:0;font-size:15px" id="waiting-msg"></p>
</div>

<div id="main-screen">
<header>
  <div class="fest">コスモス祭 2026</div>
  <h1>ビンゴ景品一覧</h1>
  <p class="lead">本学園祭は、以下の企業・団体の皆さまのご協賛により開催しております。心より御礼申し上げます。</p>
  <p class="hint">企業名をタップすると協賛品が見られます</p>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="企業名・協賛品で検索" aria-label="企業名・協賛品で検索">
  <span class="count" id="count"></span>
</div>
<main id="list"></main>
<footer>（五十音順・敬称略）</footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <button class="close" id="close" aria-label="閉じる">×</button>
  </div>
  <p class="dlg-label">協賛品</p>
  <ul class="items" id="dlg-items"></ul>
</dialog>

<script>
const SPONSORS = [
  { name: "アヴァンセ株式会社", img: "", items: [ { text: "マイルド洗顔パウダー", img: "" } ] },
  { name: "Anker Innovations Japan", img: "", items: [ { text: "スピーカー", img: "" } ] },
  { name: "株式会社RQ芦ノ湖リゾート HOTEL Rakuun", img: "", items: [ { text: "宿泊優待券", img: "" } ] },
  { name: "株式会社池田製麺", img: "", items: [ { text: "生ラーメン", img: "" }, { text: "生うどん", img: "" } ] },
  { name: "株式会社いきもん", img: "", items: [ { text: "カプセルトイ", img: "" } ] },
  { name: "伊香保グリーン牧場", img: "", items: [ { text: "入場ペア招待券", img: "" } ] },
  { name: "有限会社市原ぞうの国", img: "", items: [ { text: "市原ぞうの国 入園ペア招待券", img: "" } ] },
  { name: "株式会社ウエニ貿易", img: "", items: [ { text: "アクアシャボン ウォータリーシャンプーの香り オードトワレ", img: "" } ] },
  { name: "エクスプロージョン合同会社", img: "", items: [ { text: "WPC（プロテイン）ミルクチョコレート味 3kg", img: "" } ] },
  { name: "小川珈琲株式会社", img: "", items: [ { text: "京珈琲 ブルーマウンテンブレンド ドリップコーヒー（5杯分）", img: "" } ] },
  { name: "株式会社温泉道場", img: "", items: [ { text: "温泉チケット", img: "" } ] },
  { name: "カラオケビッグエコー", img: "", items: [ { text: "ビッグエコー カラオケパスポート", img: "" } ] },
  { name: "キスミー（伊勢半）", img: "", items: [ { text: "ヒロインメイク マスカラ", img: "" } ] },
  { name: "株式会社紀伊國屋書店", img: "", items: [ { text: "図書カード（5,000円分）", img: "" }, { text: "図書カード（3,000円分）", img: "" }, { text: "図書カード（2,000円分）", img: "" } ] },
  { name: "株式会社KINUJO", img: "", items: [ { text: "カールアイロン", img: "" } ] },
  { name: "株式会社グランバー東京ラスク", img: "", items: [ { text: "ラスク アソート詰め合わせ", img: "" } ] },
  { name: "株式会社五星コーポレーション", img: "", items: [ { text: "ポンティギ（韓国食品）", img: "" }, { text: "ジャジャンソース（韓国食品）", img: "" } ] },
  { name: "三養食品株式会社", img: "", items: [ { text: "ヤンニョムチキン ブルダック炒め麺", img: "" } ] },
  { name: "笹塚ボウル", img: "", items: [ { text: "ボウリング1ゲーム＋貸靴 無料券", img: "" } ] },
  { name: "株式会社サン食品", img: "", items: [ { text: "オキナワビアナッツ", img: "" } ] },
  { name: "株式会社阪本高生堂", img: "", items: [ { text: "グリース", img: "" }, { text: "ポストカード", img: "" } ] },
  { name: "株式会社シール堂印刷", img: "", items: [ { text: "自社ブランド製品", img: "" } ] },
  { name: "渋谷区立松濤美術館", img: "", items: [ { text: "「路上、お邪魔ですか？」展 招待券", img: "" } ] },
  { name: "スプラッシュ東京（ワンピースインク株式会社）", img: "", items: [ { text: "ツアーチケット・BBQチケットなど", img: "" } ] },
  { name: "株式会社the150", img: "", items: [ { text: "COLDGIRL（保冷トートバッグ）", img: "" }, { text: "Wrapup（iPhoneケース）", img: "" } ] },
  { name: "多摩六都科学館", img: "", items: [ { text: "多摩六都科学館 招待券（入館・観覧券）", img: "" } ] },
  { name: "株式会社千鳥饅頭総本舗", img: "", items: [ { text: "チロリアン ミックス（8本入り）", img: "" } ] },
  { name: "東京ファインフーズ株式会社", img: "", items: [ { text: "Vエイドパン まるまる（4種）", img: "" } ] },
  { name: "株式会社ディグ ディグボウル吉祥寺", img: "", items: [ { text: "ボウリング特別ご招待券", img: "" } ] },
  { name: "仲吉商事株式会社", img: "", items: [ { text: "おはし丸（ラバーウッド・23cm）", img: "" }, { text: "カフェオレマグ（ホワイト）", img: "" } ] },
  { name: "有限会社ねば塾", img: "", items: [ { text: "石鹸", img: "" }, { text: "蜂蜜", img: "" }, { text: "白無垢", img: "" } ] },
  { name: "株式会社ヒューマックスエンタテインメント（池袋HUMAXシネマズ）", img: "", items: [ { text: "ヒューマックスシネマ ご招待券", img: "" } ] },
  { name: "フンドーキン醤油株式会社", img: "", items: [ { text: "鶏炭火焼のたれ", img: "" } ] },
  { name: "株式会社フラワーリング", img: "", items: [ { text: "POINT MIRROR", img: "" } ] },
  { name: "Bungy Japan株式会社", img: "", items: [ { text: "バンジージャンプ無料クーポン", img: "" } ] },
  { name: "株式会社ビューティーネイラー", img: "", items: [ { text: "ブリングネイル（ネイルシール）", img: "" } ] },
  { name: "マルサンアイ株式会社", img: "", items: [ { text: "豆乳飲料", img: "" }, { text: "味噌", img: "" } ] },
  { name: "株式会社マンナンライフ", img: "", items: [ { text: "蒟蒻畑", img: "" } ] },
  { name: "株式会社モンロワール", img: "", items: [ { text: "リーフメモリー", img: "" } ] },
  { name: "山本漢方製薬株式会社", img: "", items: [ { text: "大麦若葉 粉末サンプル", img: "" } ] },
  { name: "ルートインジャパン株式会社（ルートインホテルズ）", img: "", items: [ { text: "ルートインホテルズ ご宿泊割引券", img: "" } ] }
];

const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slot=(img,alt)=>`<div class="slot">${img
  ?`<img src="${esc(img)}" alt="${esc(alt)}" loading="lazy">`
  :`<div class="ph">${icon}<span>画像準備中</span></div>`}</div>`;

function render(q=''){
  const k=q.trim().toLowerCase();
  const list=SPONSORS.map((s,i)=>({...s,i})).filter(s=>!k||
    s.name.toLowerCase().includes(k)||s.items.some(it=>it.text.toLowerCase().includes(k)));
  document.getElementById('count').textContent=list.length+' 社';
  document.getElementById('list').innerHTML=list.length?list.map(s=>`
    <button class="card" type="button" data-i="${s.i}">
      ${slot(s.img,s.name)}
      <div class="name">${esc(s.name)}</div>
      <div class="more">協賛品を見る ›</div>
    </button>`).join(''):'<p class="empty">該当する企業が見つかりません</p>';
}

const dlg=document.getElementById('dlg');
function openSponsor(i){
  const s=SPONSORS[i];
  document.getElementById('dlg-title').textContent=s.name;
  document.getElementById('dlg-items').innerHTML=s.items.map(it=>`
    <li class="item">${slot(it.img,it.text)}<p>${esc(it.text)}</p></li>`).join('');
  dlg.showModal();
  dlg.scrollTop=0;
}
document.getElementById('list').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(c) openSponsor(+c.dataset.i);
});
document.getElementById('close').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
// 公開時間: 2026-11-08 14:30〜16:00
const OPEN_START    = new Date('2026-11-08T14:30:00');
const OPEN_END      = new Date('2026-11-08T16:00:00');
const OVERRIDE_UNTIL = new Date('2026-11-06T23:59:59'); // ダブルタップ有効期限

let manualOverride = false;
let lastTap = 0;

function checkTime() {
  const now = new Date();
  const waiting = document.getElementById('waiting-screen');
  const main    = document.getElementById('main-screen');
  const isOpen  = manualOverride || (now >= OPEN_START && now < OPEN_END);
  if (isOpen) {
    waiting.style.display = 'none';
    main.style.display = '';
  } else {
    main.style.display = 'none';
    waiting.style.display = 'flex';
    const msg = document.getElementById('waiting-msg');
    if (now < OPEN_START) {
      msg.textContent = 'ビンゴ大会は 11月8日 14:30 に始まります';
    } else {
      msg.textContent = 'ビンゴ大会は終了しました。ご参加ありがとうございました！';
    }
  }
}

// ダブルタップで手動切替（11/6まで有効）
document.addEventListener('click', () => {
  const now = new Date();
  if (now > OVERRIDE_UNTIL) return;
  const t = Date.now();
  if (t - lastTap < 400) {
    manualOverride = !manualOverride;
    checkTime();
  }
  lastTap = t;
});

checkTime();
setInterval(checkTime, 10000);
render();
</script>
</body>
</html>
