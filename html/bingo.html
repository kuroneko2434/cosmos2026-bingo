<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ビンゴ景品一覧</title>
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --ink:#2a2420; --sub:#7a6f66;
  --accent:#d9480f; --line:#e8dfd3; --slot:#f4ede3; --shade:rgba(30,20,10,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1917; --card:#26221f; --ink:#f3eee8; --sub:#a8a09a;
    --accent:#ff8a4c; --line:#3a3430; --slot:#2f2a26; --shade:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1917; --card:#26221f; --ink:#f3eee8; --sub:#a8a09a;
  --accent:#ff8a4c; --line:#3a3430; --slot:#2f2a26; --shade:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
header{padding:40px 16px 24px;text-align:center}
.fest{display:inline-block;font-size:13px;letter-spacing:.2em;color:var(--accent);
  border:1.5px solid var(--accent);border-radius:999px;padding:2px 14px;margin-bottom:12px}
h1{margin:0;font-size:clamp(26px,7vw,40px);letter-spacing:.06em}
.lead{margin:10px auto 0;max-width:34em;color:var(--sub);font-size:14px}
.hint{margin:8px 0 0;font-size:13px;color:var(--accent)}
.tools{max-width:960px;margin:0 auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.tools-search{display:flex;gap:8px;align-items:center}
.tools-btns{display:flex;gap:8px;align-items:center}
.tools input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tools input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:13px;color:var(--sub);white-space:nowrap}
main{max-width:960px;margin:0 auto;padding:0 16px 48px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){main{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:900px){main{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;
  transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slot{width:100%;aspect-ratio:4/3;background:var(--slot);display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--line)}
.slot img{width:100%;height:100%;object-fit:contain;padding:10px;background:#fff}
.ph{width:calc(100% - 20px);height:calc(100% - 20px);border:2px dashed var(--line);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--sub);font-size:12px}
.ph svg{width:28px;height:28px;opacity:.6}
.name{padding:10px 12px 4px;font-size:14px;font-weight:600;word-break:break-word;flex:1}
.more{padding:0 12px 10px;font-size:12px;color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:32px 0}
footer{text-align:center;color:var(--sub);font-size:12px;padding:0 16px 32px}
@keyframes heartpop{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:0 12px 10px}
.more{font-size:12px;color:var(--accent)}
.like-remove{background:none;border:none;cursor:pointer;padding:0;font-size:16px;color:#e03e6b;line-height:1;font-family:inherit}
.card-sold-all{font-size:11px;font-weight:700;color:#fff;background:#e03e6b;border-radius:4px;padding:2px 6px;white-space:nowrap}
.card-sold-part{font-size:11px;font-weight:700;color:#e03e6b;border:1px solid #e03e6b;border-radius:4px;padding:2px 6px;white-space:nowrap}
.filter-like{background:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;
  font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;letter-spacing:.03em;display:inline-flex;align-items:center;gap:8px}
.filter-like.active{border-color:#c0395a;color:#c0395a;background:rgba(192,57,90,.07)}
#waiting-screen{display:none}
#help-screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center}
.help-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;text-align:left;margin-bottom:24px}
.help-card h2{margin:0 0 16px;font-size:17px;text-align:center;color:var(--ink)}
.help-step{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.help-step:last-child{margin-bottom:0}
.help-text{font-size:14px;color:var(--ink);line-height:1.5}
.help-text b{color:var(--accent)}
.btn-start{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 40px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-help{background:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;letter-spacing:.03em;display:inline-flex;align-items:center;gap:8px}
.btn-help:hover{border-color:var(--sub);color:var(--sub)}

/* 協賛品ポップアップ */
dialog{border:none;padding:0;border-radius:18px;background:var(--card);color:var(--ink);
  width:min(480px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto}
dialog::backdrop{background:var(--shade)}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 8px}
.dlg-head h2{margin:0;font-size:18px;flex:1;word-break:break-word}
.close{border:none;background:var(--slot);color:var(--ink);width:36px;height:36px;border-radius:50%;
  font-size:20px;line-height:1;cursor:pointer;flex:none}
.dlg-label{margin:0 18px 8px;font-size:12px;letter-spacing:.15em;color:var(--accent)}
.items{list-style:none;margin:0;padding:0 18px 20px;display:grid;gap:12px}
.item{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item .slot{aspect-ratio:16/9}
.item p{margin:0;padding:10px 12px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<!--
  ▼ 画像の差し込み方
  1. このファイルと同じ場所に「images」フォルダを作り、ロゴや協賛品の画像を入れる
  2. 下の SPONSORS の該当箇所に画像のファイル名を書く
     ・企業ロゴ（一覧のカード）… img: ""
       例）{ name: "キスミー（伊勢半）", img: "images/isehan.png", items: [...] }

  img が空のあいだは「画像準備中」の枠が表示されます。
-->
<div id="waiting-screen" style="min-height:100vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px;">
  <div class="fest">コスモス祭 2026</div>
  <h1 style="margin:16px 0 12px;font-size:clamp(22px,6vw,36px)">ビンゴ準備中</h1>
  <p style="color:var(--sub);margin:0;font-size:15px" id="waiting-msg"></p>
</div>

<div id="help-screen">
  <div class="fest">コスモス祭 2026</div>
  <div class="help-card">
    <h2>♥ メモ機能の使い方</h2>
    <div class="help-step">
      <div class="help-text">企業名をタップすると<b>協賛品の詳細</b>が見られます</div>
    </div>
    <div class="help-step">
      <div class="help-text">詳細画面を<b>2回連続タップ</b>すると ♥ メモに追加できます</div>
    </div>
    <div class="help-step">
      <div class="help-text">カードの ♥ をタップすると<b>メモを外せます</b></div>
    </div>
    <div class="help-step">
      <div class="help-text">ハートアイコンの <b>いいねした企業</b> ボタンでいいね済みの企業だけ絞り込めます</div>
    </div>
  </div>
  <button class="btn-start" id="help-ok">景品一覧を見る →</button>
</div>

<div id="main-screen">
<header>
  <div class="fest">コスモス祭 2026</div>
  <h1>ビンゴ景品一覧</h1>
  <p class="lead">本学園祭は、以下の企業・団体の皆さまのご協賛により開催しております。心より御礼申し上げます。</p>
  <p class="hint">企業名をタップすると協賛品が見られます</p>
</header>
<div class="tools">
  <div class="tools-search">
    <input id="q" type="search" placeholder="企業名・協賛品で検索" aria-label="企業名・協賛品で検索">
    <span class="count" id="count"></span>
  </div>
  <div class="tools-btns">
    <button class="filter-like" id="filter-like" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>いいねした企業</button>
    <button class="btn-help" id="show-help" aria-label="使い方を見る"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>使い方</button>
  </div>
</div>
<main id="list"></main>
<footer>（五十音順・敬称略）</footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <button class="close" id="close" aria-label="閉じる">×</button>
  </div>
  <p class="dlg-label">協賛品</p>
  <ul class="items" id="dlg-items"></ul>
</dialog>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slot=(img,alt)=>img?`<div class="slot"><img src="${esc(img)}" alt="${esc(alt)}" loading="lazy"></div>`:'';
const slotItem=(img,alt,soldOut=false)=>`<div class="slot" style="position:relative">${img?`<img src="${esc(img)}" alt="${esc(alt)}" loading="lazy"${soldOut?' style="opacity:.4"':''}>`:`<div class="ph">${icon}<span>画像準備中</span></div>`}${soldOut?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)"><span style="color:#fff;font-weight:700;font-size:15px;letter-spacing:.1em;border:2px solid #fff;padding:4px 12px;border-radius:4px">SOLD OUT</span></div>`:''}` + `</div>`;

let likes=new Set();
try{ likes=new Set(JSON.parse(localStorage.getItem('cosmos_likes')||'[]')); }catch(e){}
function saveLikes(){ try{ localStorage.setItem('cosmos_likes',JSON.stringify([...likes])); }catch(e){} }

let filterLike=false;

function render(q=''){
  const k=q.trim().toLowerCase();
  let list=SPONSORS.map((s,i)=>({...s,i})).filter(s=>!k||
    s.name.toLowerCase().includes(k)||s.items.some(it=>it.text.toLowerCase().includes(k)));
  if(filterLike) list=list.filter(s=>likes.has(s.i));
  list.sort((a,b)=>{
    const soldA=a.items.filter((_,j)=>soldOutSet.has(a.i+'-'+j)).length===a.items.length&&a.items.length>0;
    const soldB=b.items.filter((_,j)=>soldOutSet.has(b.i+'-'+j)).length===b.items.length&&b.items.length>0;
    return soldA===soldB?0:soldA?1:-1;
  });
  document.getElementById('count').textContent=list.length+' 社';
  document.getElementById('list').innerHTML=list.length?list.map(s=>`
    <button class="card" type="button" data-i="${s.i}">
      ${slot(s.img,s.name)}
      <div class="name">${esc(s.name)}</div>
      <div class="card-footer">
        <span class="more">協賛品を見る ›</span>
        <span style="display:flex;align-items:center;gap:6px">
          ${(()=>{const total=s.items.length;const sold=s.items.filter((_,j)=>soldOutSet.has(s.i+'-'+j)).length;if(sold===0)return'';if(sold===total)return'<span class="card-sold-all">売切れ</span>';return'<span class="card-sold-part">一部売切れ</span>';})()}
          ${likes.has(s.i)?`<span class="like-remove" role="button" tabindex="0" data-like="${s.i}" aria-label="いいねを外す">♥</span>`:''}
        </span>
      </div>
    </button>`).join(''):'<p class="empty">該当する企業が見つかりません</p>';
}

  const s=SPONSORS[i];
  document.getElementById('dlg-title').textContent=s.name;
  document.getElementById('dlg-items').innerHTML=s.items.map((it,j)=>{
    const so=soldOutSet.has(i+'-'+j)||it.soldOut||false;
    return`<li class="item">${slotItem(it.img,it.text,so)}<p>${esc(it.text)}${so?` <span style="color:#e03e6b;font-size:12px;font-weight:700">（売切れ）</span>`:''}</p></li>`;
  }).join('');
  dlg.showModal();
  dlg.scrollTop=0;
}
dlg.addEventListener('click',e=>{
  if(e.target===dlg){ dlg.close(); return; }
  if(e.target.closest('#close')){ dlg.close(); return; }
  const now=Date.now();
  if(now-dlgLastTap<400 && currentSponsor>=0){
    likes.has(currentSponsor)?likes.delete(currentSponsor):likes.add(currentSponsor);
    saveLikes(); render(document.getElementById('q').value);
    const heart=document.createElement('div');
    heart.textContent='♥'; heart.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);font-size:60px;color:#e03e6b;pointer-events:none;animation:heartpop .6s forwards';
    dlg.appendChild(heart); setTimeout(()=>heart.remove(),600);
    dlgLastTap=0;
  } else { dlgLastTap=now; }
});
document.getElementById('list').addEventListener('click',e=>{
  const rb=e.target.closest('.like-remove');
  if(rb){ e.stopPropagation(); likes.delete(+rb.dataset.like); saveLikes(); render(document.getElementById('q').value); return; }
  const c=e.target.closest('.card'); if(c) openSponsor(+c.dataset.i);
});
document.getElementById('filter-like').addEventListener('click',function(){
  filterLike=!filterLike; this.classList.toggle('active',filterLike);
  this.innerHTML=filterLike?'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>いいねした企業':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>いいねした企業';
  this.setAttribute('aria-pressed',filterLike);
  render(document.getElementById('q').value);
});
document.getElementById('close').addEventListener('click',()=>dlg.close());
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
// 公開時間: 2026-11-08 14:30〜16:00
const OPEN_START    = new Date('2026-11-08T14:30:00');
const OPEN_END      = new Date('2026-11-08T16:00:00');
const OVERRIDE_UNTIL = new Date('2026-11-06T23:59:59'); // ダブルタップ有効期限

let manualOverride = false;
let lastTap = 0;

let helpSeen = false;
function showHelp(){
  document.getElementById('waiting-screen').style.display='none';
  document.getElementById('main-screen').style.display='none';
  document.getElementById('help-screen').style.display='flex';
}
function showMain(){
  helpSeen=true;
  document.getElementById('help-screen').style.display='none';
  document.getElementById('waiting-screen').style.display='none';
  document.getElementById('main-screen').style.display='';
  render(document.getElementById('q').value);
}
function checkTime() {
  const now = new Date();
  const waiting = document.getElementById('waiting-screen');
  const main    = document.getElementById('main-screen');
  const help    = document.getElementById('help-screen');
  const isOpen  = manualOverride || (now >= OPEN_START && now < OPEN_END);
  if (isOpen) {
    if(!helpSeen){ showHelp(); return; }
    if(help.style.display==='flex') return;
    waiting.style.display = 'none';
    help.style.display = 'none';
    main.style.display = '';
  } else {
    main.style.display = 'none';
    help.style.display = 'none';
    waiting.style.display = 'flex';
    const msg = document.getElementById('waiting-msg');
    if (now < OPEN_START) {
      msg.textContent = 'ビンゴ大会は 11月8日 14:30 に始まります';
    } else {
      msg.textContent = 'ビンゴ大会は終了しました。ご参加ありがとうございました！';
    }
  }
}
document.getElementById('help-ok').addEventListener('click', showMain);
document.getElementById('show-help').addEventListener('click', showHelp);

// 3回タップで手動切替（11/6まで有効）
let tapCount = 0, tapResetTimer = null;
document.addEventListener('click', () => {
  const now = new Date();
  if (now > OVERRIDE_UNTIL) return;
  tapCount++;
  clearTimeout(tapResetTimer);
  tapResetTimer = setTimeout(() => { tapCount = 0; }, 600);
  if (tapCount >= 3) {
    tapCount = 0;
    manualOverride = !manualOverride;
    checkTime();
  }
});

checkTime();
setInterval(checkTime, 10000);
loadSoldOut();
</script>
