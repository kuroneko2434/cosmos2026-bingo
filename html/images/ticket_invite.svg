<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1" fill="#c8a96e" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" fill="#f9f3e8"/>
  <rect width="400" height="240" fill="url(#dots)"/>

  <!-- Main ticket shape -->
  <rect x="20" y="30" width="360" height="180" rx="12" fill="#fff" stroke="#c8a96e" stroke-width="2"/>

  <!-- Left notch -->
  <circle cx="20" cy="120" r="18" fill="#f9f3e8"/>
  <!-- Right notch -->
  <circle cx="380" cy="120" r="18" fill="#f9f3e8"/>

  <!-- Dashed divider -->
  <line x1="90" y1="48" x2="90" y2="192" stroke="#c8a96e" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Left stub -->
  <text x="55" y="108" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#a07840" letter-spacing="2">招</text>
  <text x="55" y="128" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#a07840" letter-spacing="2">待</text>
  <text x="55" y="148" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#a07840" letter-spacing="2">券</text>

  <!-- Star decorations -->
  <text x="118" y="78" font-family="sans-serif" font-size="16" fill="#c8a96e">✦</text>
  <text x="348" y="78" font-family="sans-serif" font-size="16" fill="#c8a96e">✦</text>

  <!-- Main text -->
  <text x="245" y="105" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="30" font-weight="bold" fill="#6b4c1e" letter-spacing="4">招待券</text>
  <text x="245" y="135" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#a07840" letter-spacing="6">INVITATION</text>

  <!-- Bottom border line -->
  <line x1="118" y1="158" x2="372" y2="158" stroke="#c8a96e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="245" y="178" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="11" fill="#b89060">コスモス祭 2026</text>
</svg>
