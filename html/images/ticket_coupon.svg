<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <pattern id="stripe" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4a7c59" stroke-width="3" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" fill="#f0f7f2"/>
  <rect width="400" height="240" fill="url(#stripe)"/>

  <!-- Main ticket shape -->
  <rect x="20" y="30" width="360" height="180" rx="12" fill="#fff" stroke="#4a7c59" stroke-width="2"/>

  <!-- Left notch -->
  <circle cx="20" cy="120" r="18" fill="#f0f7f2"/>
  <!-- Right notch -->
  <circle cx="380" cy="120" r="18" fill="#f0f7f2"/>

  <!-- Dashed divider -->
  <line x1="90" y1="48" x2="90" y2="192" stroke="#4a7c59" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Left stub text -->
  <text x="55" y="100" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#2e6040" letter-spacing="2">ク</text>
  <text x="55" y="118" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#2e6040" letter-spacing="2">ー</text>
  <text x="55" y="136" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#2e6040" letter-spacing="2">ポ</text>
  <text x="55" y="154" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#2e6040" letter-spacing="2">ン</text>


  <!-- Main text -->
  <text x="245" y="108" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="30" font-weight="bold" fill="#1e4d2e" letter-spacing="4">クーポン</text>
  <text x="245" y="136" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#4a7c59" letter-spacing="6">COUPON</text>

  <!-- Bottom border line -->
  <line x1="118" y1="158" x2="372" y2="158" stroke="#4a7c59" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="245" y="178" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="11" fill="#4a7c59">コスモス祭 2026</text>
</svg>
